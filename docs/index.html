<body>
  <div id="app">
    <div class="center-fill"><div class="spinner"></div></div>
  </div>

  <!-- Block all zoom: pinch (two fingers), double-tap, and ctrl/⌘+scroll -->
  <script>
    (function () {
      // iOS Safari pinch gestures
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      // multi-touch pinch (iOS/Android)
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      // double-tap to zoom
      var lastTouch = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouch <= 300) e.preventDefault();
        lastTouch = now;
      }, { passive: false });
      // desktop ctrl/⌘ + wheel pinch-zoom
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey || e.metaKey) e.preventDefault();
      }, { passive: false });
      // desktop ctrl/⌘ + (+/-/0) keyboard zoom
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) !== -1) e.preventDefault();
      });
    })();
  </script>

  <!-- Supabase JS client (auth + database + realtime) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide icons (clinical line icons) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
